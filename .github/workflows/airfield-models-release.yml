name: Publish airfield model archive

# One-time publication of the requested archive, without committing the large
# generated ZIP to Git. Future normal pushes must not create more releases.
on:
  push:
    branches: ['arena/b5354172-my-godot-game']
    paths: ['.github/workflows/airfield-models-release.yml']

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'Publish airfield model archive'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build and verify archive
        run: python3 tools/package_airfield_models.py "$RUNNER_TEMP/airfield_models_and_previews.zip"
      - name: Preserve archive as an Actions artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: airfield-models-and-previews
          path: ${{ runner.temp }}/airfield_models_and_previews.zip
          compression-level: 0
          retention-days: 30
      - name: Publish prerelease download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="airfield-models-${GITHUB_SHA:0:8}"
          gh release create "$tag" "$RUNNER_TEMP/airfield_models_and_previews.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Модели аэродрома — архив" \
            --notes "32 модели GLB, исходник Blender, сцены Godot и превью. Это набор моделей, не выпуск полной игры; собранный аэродром остаётся отдельной сценой." \
            --prerelease
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name == "airfield_models_and_previews.zip") | .url' | grep .
