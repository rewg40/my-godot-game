name: Deploy docs site (ZOMBI bible)

# Собирает сайт-библию проекта из game-docs/src/ и публикует на GitHub Pages
# (ветка gh-pages, корень сайта). Работает и из этой ветки, и из main.

on:
  push:
    branches:
      - main
      - arena/73c7370f-my-godot-game
    paths:
      - 'game-docs/**'
      - '.github/workflows/deploy-docs-site.yml'
  workflow_dispatch:
    inputs:
      note:
        description: 'Причина ручного деплоя (необязательно)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write      # чтобы при необходимости включить GitHub Pages из same workflow
  metadata: read

concurrency:
  group: deploy-docs-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Assemble static site
        working-directory: game-docs/src
        run: |
          set -euo pipefail
          rm -rf _site && mkdir -p _site
          cp index.html app.css app.js config.json _site/
          cp -r content _site/content
          if [ -d docs ]; then mkdir -p _site/docs && cp -r docs/. _site/docs/; fi
          : > _site/.nojekyll
          python3 - <<'PY'
          import json, pathlib, sys
          bad = []
          for p in sorted(pathlib.Path('_site/content').glob('*.json')):
              try:
                  json.loads(p.read_text(encoding='utf-8'))
                  print('json ok  :', p.name)
              except Exception as e:
                  bad.append((p.name, e))
                  print('json FAIL:', p.name, e)
          if bad:
              sys.exit('Контент-JSON битый — сайт не публикуется, пока не починишь.')
          PY
          du -sh _site

      - name: Publish to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: game-docs/src/_site
          clean: true
          clean-exclude: |
            .nojekyll
          commit-message: "chore(site): deploy ZOMBI bible (${{ github.ref_name }})"

      - name: "Ensure GitHub Pages enabled (источник gh-pages /)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          R="${{ github.repository }}"
          code=$(curl -s -o /tmp/pages.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$R/pages")
          echo "GET /pages -> $code"
          if [ "$code" != "200" ]; then
            echo "Pages ещё не включён — пробуем включить из workflow…"
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: application/json' \
              -d '{"build_type":"branch","source":{"branch":"gh-pages","path":"/"}}' \
              "https://api.github.com/repos/$R/pages" -o /tmp/pages_post.json -w 'POST -> %{http_code}\n' || true
            curl -s -X PATCH -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: application/json' \
              -d '{"build_type":"branch","source":{"branch":"gh-pages","path":"/"}}' \
              "https://api.github.com/repos/$R/pages" -o /tmp/pages_patch.json -w 'PATCH -> %{http_code}\n' || true
          fi
          for i in $(seq 1 12); do
            url=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$R/pages" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("html_url",""))' 2>/dev/null || true)
            if [ -n "${url:-}" ]; then echo "Pages URL: $url"; break; fi
            echo "жду включения Pages… ($i)"; sleep 5
          done

      - name: Summary
        run: |
          echo "### Сайт обновлён" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: https://rewg40.github.io/my-godot-game/" >> "$GITHUB_STEP_SUMMARY"
          echo "Источник: \`game-docs/src/\` в ветке \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
