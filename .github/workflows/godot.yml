name: Godot smoke test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Godot 4.3
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            --output "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Import project resources
        shell: bash
        run: |
          set +e
          godot --headless --editor --path . --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ] || grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' "$RUNNER_TEMP/import.log"; then
            tail -n 80 "$RUNNER_TEMP/import.log" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
      - name: Test the playable chapter
        shell: bash
        run: |
          export SHARDS_TEST_TRACE="$RUNNER_TEMP/smoke-trace.txt"
          set +e
          godot --headless --verbose --path . --script res://tests/smoke_test.gd 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ] || ! grep -q 'ALL SMOKE TESTS PASSED' "$RUNNER_TEMP/smoke.log" || grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' "$RUNNER_TEMP/smoke.log"; then
            echo "::error::Godot exited with code $result"
            if [ -f "$SHARDS_TEST_TRACE" ]; then
              echo "::error::TRACE $(tail -n 60 "$SHARDS_TEST_TRACE" | tr '\n' '|')"
            fi
            echo "::error::OUTPUT $(tail -n 60 "$RUNNER_TEMP/smoke.log" | tr '\n' '|')"
            exit 1
          fi
