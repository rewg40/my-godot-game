name: Godot smoke test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Godot 4.3
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            --output "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Import project resources
        shell: bash
        run: |
          set +e
          godot --headless --editor --path . --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ] || grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' "$RUNNER_TEMP/import.log"; then
            log="$(tail -n 80 "$RUNNER_TEMP/import.log")"
            log="${log//'%'/'%25'}"; log="${log//$'\r'/'%0D'}"; log="${log//$'\n'/'%0A'}"
            echo "::error::Godot import exited with code $result%0A$log"
            exit 1
          fi
      - name: Test the playable chapter
        shell: bash
        run: |
          set +e
          godot --headless --path . --script res://tests/smoke_test.gd 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ] || ! grep -q 'ALL SMOKE TESTS PASSED' "$RUNNER_TEMP/smoke.log" || grep -E 'SCRIPT ERROR|Parse Error|^ERROR:|ObjectDB instances leaked' "$RUNNER_TEMP/smoke.log"; then
            log="$(tail -n 100 "$RUNNER_TEMP/smoke.log")"
            log="${log//'%'/'%25'}"; log="${log//$'\r'/'%0D'}"; log="${log//$'\n'/'%0A'}"
            echo "::error::Godot smoke test exited with code $result%0A$log"
            exit 1
          fi
      - name: Render 3D diagnostics
        if: always()
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb
          fi
          python3 -m pip install --quiet pillow
          export SHARDS_PREVIEW_DIR="$RUNNER_TEMP"
          xvfb-run -a -s '-screen 0 1280x720x24' godot --path . --rendering-method gl_compatibility --audio-driver Dummy --script res://tests/visual_probe.gd
      - name: Inspect beach (1)
        if: always()
        shell: bash
        run: python3 tests/encode_probe.py "$RUNNER_TEMP/beach3d.png" BEACH 0
      - name: Inspect beach (2)
        if: always()
        shell: bash
        run: python3 tests/encode_probe.py "$RUNNER_TEMP/beach3d.png" BEACH 1
      - name: Inspect camp (1)
        if: always()
        shell: bash
        run: python3 tests/encode_probe.py "$RUNNER_TEMP/camp3d.png" CAMP 0
      - name: Inspect camp (2)
        if: always()
        shell: bash
        run: python3 tests/encode_probe.py "$RUNNER_TEMP/camp3d.png" CAMP 1
