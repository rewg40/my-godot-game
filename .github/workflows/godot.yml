name: Godot smoke test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Godot 4.3
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            --output "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Import project resources
        shell: bash
        run: |
          set +e
          godot --headless --editor --path . --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ] || grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' "$RUNNER_TEMP/import.log"; then
            log="$(tail -n 80 "$RUNNER_TEMP/import.log")"
            log="${log//'%'/'%25'}"; log="${log//$'\r'/'%0D'}"; log="${log//$'\n'/'%0A'}"
            echo "::error::Godot import exited with code $result%0A$log"
            exit 1
          fi
      - name: Test standalone airfield models
        shell: bash
        run: |
          python3 tests/validate_airfield_kit.py
          set +e
          godot --headless --path . --script res://tests/airfield_kit_test.gd 2>&1 | tee "$RUNNER_TEMP/airfield.log"
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ] || ! grep -q 'AIRFIELD GODOT IMPORT TESTS PASSED' "$RUNNER_TEMP/airfield.log" || grep -E 'SCRIPT ERROR|Parse Error|^ERROR:|ObjectDB instances leaked' "$RUNNER_TEMP/airfield.log"; then
            log="$(tail -n 100 "$RUNNER_TEMP/airfield.log")"
            log="${log//'%'/'%25'}"; log="${log//$'\r'/'%0D'}"; log="${log//$'\n'/'%0A'}"
            echo "::error::Airfield model test exited with code $result%0A$log"
            exit 1
          fi
      - name: Test the playable chapter
        shell: bash
        run: |
          set +e
          godot --headless --path . --script res://tests/smoke_test.gd 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ] || ! grep -q 'ALL SMOKE TESTS PASSED' "$RUNNER_TEMP/smoke.log" || grep -E 'SCRIPT ERROR|Parse Error|^ERROR:|ObjectDB instances leaked' "$RUNNER_TEMP/smoke.log"; then
            log="$(grep -E '^(ERROR:|SCRIPT ERROR|Parse Error|SMOKE TESTS FAILED|Wave diagnostics:|Legacy position:)' "$RUNNER_TEMP/smoke.log" | tail -n 60 || true)"
            if [ -z "$log" ]; then log="$(tail -n 60 "$RUNNER_TEMP/smoke.log")"; fi
            log="${log//'%'/'%25'}"; log="${log//$'\r'/'%0D'}"; log="${log//$'\n'/'%0A'}"
            echo "::error::Godot smoke test exited with code $result%0A$log"
            exit 1
          fi
      - name: Test modular base construction
        shell: bash
        run: |
          set +e
          godot --headless --path . --script res://tests/building_test.gd 2>&1 | tee "$RUNNER_TEMP/building.log"
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ] || ! grep -q 'BUILDING TESTS PASSED' "$RUNNER_TEMP/building.log" || grep -E 'SCRIPT ERROR|Parse Error|^ERROR:|ObjectDB instances leaked' "$RUNNER_TEMP/building.log"; then
            log="$(tail -n 100 "$RUNNER_TEMP/building.log")"
            log="${log//'%'/'%25'}"; log="${log//$'\r'/'%0D'}"; log="${log//$'\n'/'%0A'}"
            echo "::error::Building test exited with code $result%0A$log"
            exit 1
          fi
      - name: Test damaged save recovery
        shell: bash
        run: |
          set +e
          godot --headless --path . --script res://tests/save_recovery_test.gd 2>&1 | tee "$RUNNER_TEMP/save-recovery.log"
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ] || ! grep -q 'SAVE RECOVERY TESTS PASSED' "$RUNNER_TEMP/save-recovery.log" || grep -E 'SCRIPT ERROR|Parse Error|^ERROR:|ObjectDB instances leaked' "$RUNNER_TEMP/save-recovery.log"; then
            log="$(tail -n 80 "$RUNNER_TEMP/save-recovery.log")"
            log="${log//'%'/'%25'}"; log="${log//$'\r'/'%0D'}"; log="${log//$'\n'/'%0A'}"
            echo "::error::Save recovery test exited with code $result%0A$log"
            exit 1
          fi
